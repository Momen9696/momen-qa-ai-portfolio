<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="title desc">
  <title id="title">CI/CD platform architecture</title>
  <desc id="desc">The React dashboard calls FastAPI. The execution service runs only catalogued Pytest, Robot, and Playwright suites. Signed webhooks and a publish script can ingest outside results.</desc>
  <rect width="960" height="420" fill="#f4f1ea"/>
  <g font-family="ui-sans-serif, sans-serif" font-size="15" fill="#101820">
    <rect x="40" y="40" width="240" height="56" rx="10" fill="#101820"/>
    <text x="160" y="74" text-anchor="middle" fill="#f4f1ea">React dashboard</text>
    <rect x="360" y="40" width="220" height="56" rx="10" fill="#0f766e"/>
    <text x="470" y="74" text-anchor="middle" fill="#fff">FastAPI</text>
    <rect x="660" y="40" width="250" height="56" rx="10" fill="#fff" stroke="#101820"/>
    <text x="785" y="74" text-anchor="middle">SQLite</text>
    <rect x="360" y="150" width="220" height="56" rx="10" fill="#a16207"/>
    <text x="470" y="184" text-anchor="middle" fill="#fff">Execution service</text>
    <rect x="80" y="280" width="180" height="56" rx="10" fill="#fff" stroke="#101820"/>
    <text x="170" y="314" text-anchor="middle">Pytest adapter</text>
    <rect x="300" y="280" width="200" height="56" rx="10" fill="#fff" stroke="#101820"/>
    <text x="400" y="314" text-anchor="middle">Robot adapter</text>
    <rect x="540" y="280" width="220" height="56" rx="10" fill="#fff" stroke="#101820"/>
    <text x="650" y="314" text-anchor="middle">Playwright adapter</text>
    <rect x="80" y="150" width="200" height="56" rx="10" fill="#fff" stroke="#101820"/>
    <text x="180" y="184" text-anchor="middle">Signed webhooks</text>
  </g>
  <g stroke="#101820" stroke-width="1.6" fill="none">
    <path d="M280 68 H360"/>
    <path d="M580 68 H660"/>
    <path d="M470 96 V150"/>
    <path d="M280 178 H360"/>
    <path d="M470 206 V248 H170 V280"/>
    <path d="M470 248 H400 V280"/>
    <path d="M470 248 H650 V280"/>
  </g>
</svg>
