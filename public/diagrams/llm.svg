<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" role="img" aria-labelledby="title desc">
  <title id="title">LLM evaluation architecture</title>
  <desc id="desc">A dataset and prompt templates enter a batch runner. The runner calls a mock provider or an optional OpenAI-compatible adapter, then metrics, reports, and an optional dashboard.</desc>
  <rect width="960" height="440" fill="#f4f1ea"/>
  <g font-family="ui-sans-serif, sans-serif" font-size="15" fill="#101820">
    <rect x="36" y="36" width="200" height="56" rx="10" fill="#fff" stroke="#101820"/>
    <text x="136" y="70" text-anchor="middle">Dataset</text>
    <rect x="36" y="120" width="200" height="56" rx="10" fill="#fff" stroke="#101820"/>
    <text x="136" y="154" text-anchor="middle">Prompt templates</text>
    <rect x="300" y="78" width="200" height="56" rx="10" fill="#101820"/>
    <text x="400" y="112" text-anchor="middle" fill="#f4f1ea">Batch runner</text>
    <rect x="560" y="36" width="360" height="56" rx="10" fill="#0f766e"/>
    <text x="740" y="70" text-anchor="middle" fill="#fff">Mock provider (default)</text>
    <rect x="560" y="120" width="360" height="56" rx="10" fill="#fff" stroke="#101820"/>
    <text x="740" y="154" text-anchor="middle">OpenAI-compatible adapter</text>
    <rect x="300" y="230" width="200" height="56" rx="10" fill="#a16207"/>
    <text x="400" y="264" text-anchor="middle" fill="#fff">Metric registry</text>
    <rect x="560" y="230" width="360" height="56" rx="10" fill="#fff" stroke="#101820"/>
    <text x="740" y="264" text-anchor="middle">JSON, HTML, CSV reports</text>
    <rect x="560" y="330" width="360" height="56" rx="10" fill="#fff" stroke="#101820"/>
    <text x="740" y="364" text-anchor="middle">FastAPI store and Streamlit</text>
  </g>
  <g stroke="#101820" stroke-width="1.6" fill="none">
    <path d="M236 64 H300"/>
    <path d="M236 148 H300"/>
    <path d="M500 106 H560"/>
    <path d="M400 134 V230"/>
    <path d="M500 258 H560"/>
    <path d="M740 286 V330"/>
  </g>
</svg>
